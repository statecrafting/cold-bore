# cold-bore broker configuration (mounted as conf.d/20-coldbore.conf).
#
# The stream protocol hands clients an advertised host:port after the
# handshake; from the host machine the broker is only reachable via the
# mapped localhost ports, so advertise those. Without this, native stream
# clients connect to 5552, then get redirected to the container hostname
# and hang.
stream.advertised_host = localhost
stream.advertised_port = 5552

# Lab-friendly memory watermark: the broker should absorb sizeable backlogs
# (that is the point of the drills) but start throttling publishers before
# it threatens the host.
vm_memory_high_watermark.relative = 0.6
