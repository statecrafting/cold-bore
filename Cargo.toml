[workspace]
resolver = "3"
members = [
    "crates/coldbore-proto",
    "crates/coldbore-edge",
    "crates/coldbore-ingest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/statecrafting/cold-bore"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.dependencies]
coldbore-proto = { path = "crates/coldbore-proto" }
anyhow = "1"
futures-util = "0.3"
hdrhistogram = "7"
lapin = "4"
rabbitmq-stream-client = "0.11"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
